- name: Install Ansible on Controller node
  hosts: ctr
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Bootstrap required package bindings
      ansible.builtin.raw: apt-get update && apt-get install -y python3-apt python3-venv
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

  tasks:
    - name: Ensure prerequisites are installed (Ubuntu/Debian)
      ansible.builtin.apt:
        name:
          - unzip
        state: present
        update_cache: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Create Ansible virtual environment
      ansible.builtin.command:
        cmd: /usr/bin/python3 -m venv --system-site-packages /opt/ansible-venv
        creates: /opt/ansible-venv/bin/pip

    - name: Install Ansible and AWS SDK components into the virtual environment
      ansible.builtin.pip:
        name:
          - ansible
          - boto3
          - botocore
        virtualenv: /opt/ansible-venv
        state: present

    - name: Symlink Ansible binaries into /usr/local/bin
      ansible.builtin.file:
        src: /opt/ansible-venv/bin/{{ item }}
        dest: /usr/local/bin/{{ item }}
        state: link
        force: true
      loop:
        - ansible
        - ansible-config
        - ansible-console
        - ansible-connection
        - ansible-doc
        - ansible-galaxy
        - ansible-inventory
        - ansible-playbook
        - ansible-pull
        - ansible-vault

    # --- START OFFICIAL AWS CLI V2 INSTALLATION BLOCK ---
    - name: Check if AWS CLI v2 is already installed
      ansible.builtin.command: aws --version
      register: aws_cli_check
      failed_when: false
      changed_when: false

    - name: Download and install AWS CLI v2 bundle
      block:
        - name: Download AWS CLI zip installer
          ansible.builtin.get_url:
            url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            dest: /tmp/awscliv2.zip
            mode: '0644'

        - name: Unarchive AWS CLI bundle
          ansible.builtin.unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: true

        - name: Run AWS CLI installation script
          ansible.builtin.command: /tmp/aws/install --update
          changed_when: true
      when: aws_cli_check.rc != 0  # Only runs if "aws" command isn't found

    - name: Install AWS Session Manager Plugin (Debian/Ubuntu)
      ansible.builtin.apt:
        deb: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Setup destination folder
      ansible.builtin.file:
        path: /opt/ansible
        state: directory

    - name: Copy configs
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/ansible/
        owner: root
        group: root
        mode: '0644'
      loop:
        - ansible.cfg
        - compose.yaml
        - inventory.ini
        - playbook-web-stack.yaml
        - playbook-mon-stack.yaml
        - prometheus.yml
        - grafana-provisioning

    - name: Install all Ansible roles and collections on the control node
      ansible.builtin.command: "ansible-galaxy {{ item.type }} install {{ item.name }}"
      loop:
        - { type: 'role',       name: 'geerlingguy.docker' }
        - { type: 'collection', name: 'amazon.aws' }
        - { type: 'collection', name: 'community.docker' }
        - { type: 'collection', name: 'prometheus.prometheus' }
      become: false
      changed_when: false

- name: Validate virtual environment python interpreter override
  hosts: ctr
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /opt/ansible-venv/bin/python

  tasks:
    - name: Verify Ansible is importable from the virtual environment
      ansible.builtin.command: "{{ ansible_python_interpreter }} -c 'import ansible; print(ansible.__version__)'"
      register: ansible_version_check
      changed_when: false

    - name: Verify boto3 is importable from the virtual environment
      ansible.builtin.command: "{{ ansible_python_interpreter }} -c 'import boto3; print(boto3.__version__)'"
      register: boto3_version_check
      changed_when: false